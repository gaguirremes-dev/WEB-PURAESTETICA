<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <defs>
    <clipPath id="c"><circle cx="50" cy="50" r="48"/></clipPath>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0b174"/>
      <stop offset="100%" stop-color="#b58b38"/>
    </linearGradient>
  </defs>
  <!-- Borde dorado circular -->
  <circle cx="50" cy="50" r="50" fill="url(#g)"/>
  <!-- Imagen recortada en círculo -->
  <image href="data:image/png;base64," x="2" y="2" width="96" height="96" clip-path="url(#c)" preserveAspectRatio="xMidYMid slice"/>
