server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/plain text/css application/javascript
               application/json image/svg+xml font/woff2;

    autoindex off;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(css|js|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(env|sh|sql|log|yml|yaml|md)$ { deny all; return 404; }
    location ~ /\.git        { deny all; return 404; }
    location ~ /node_modules { deny all; return 404; }

    error_page 404 /index.html;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-XSS-Protection        "1; mode=block"                   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=()"        always;

    # ── Content Security Policy ───────────────────────────────────
    # 'unsafe-eval'   → requerido por GSAP (usa Function() en su ticker)
    # 'unsafe-inline' → estilos inline en HTML + script de tabs (nuestro-trabajo)
    # cdn.jsdelivr.net → GSAP 3 + Swiper 11
    # fonts.googleapis.com / fonts.gstatic.com → Google Fonts
    add_header Content-Security-Policy "
        default-src 'self';
        script-src  'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net;
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
        font-src    'self' https://fonts.gstatic.com data:;
        img-src     'self' data: blob:;
        media-src   'self' blob:;
        connect-src 'self';
        frame-ancestors 'none';
        base-uri    'self';
        form-action 'self' https://wa.me;
    " always;
}
